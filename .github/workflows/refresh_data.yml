          "

      - name: 💾 Commit updated CSVs (if any changes)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only data CSVs (never model code or notebooks)
          for liga in chile arg bra mex esp eng bund ita fra ned por bel tur sco aut den gre nor swe ucl unl nba; do
            git add "$liga/data/partidos.csv" "$liga/data/fixture.csv"
            if [ -f "$liga/data/box_score.csv" ]; then git add "$liga/data/box_score.csv"; fi
          done

          # Only commit if there are actual changes.
          # Si alguna liga falló, sus CSV no se tocaron: se commitean las demás y el job
          # termina en rojo igual (GitHub marca el run como fallido por ese paso).
          if git diff --cached --quiet; then
            echo "✅ No new match data — nothing to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "data(auto): refresh all leagues [${TIMESTAMP}]

          Automated daily refresh from ESPN API via GitHub Actions.
          CSVs (partidos, fixture, box score) updated: chile, arg, bra, mex, esp, eng, bund, ita, fra, ned, por, bel, tur, sco, aut, den, gre, nor, swe, ucl, unl, nba."
            git push origin main
            echo "✅ Pushed updated CSVs to main."
          fi


