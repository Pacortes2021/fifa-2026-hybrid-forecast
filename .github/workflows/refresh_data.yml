name: 🔄 Refresh ESPN Match Data

on:
  schedule:
    # Runs every day at 06:00 UTC (02:00 Santiago / 03:00 Buenos Aires)
    # This is after midnight local time, so all same-day matches are finished
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write  # Needed to push the updated CSVs

jobs:
  refresh:
    name: Fetch & Commit Latest Matches
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          pip install --quiet requests pandas pytz

      - name: 🇨🇱 Recolectar Chile
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'chile')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇦🇷 Recolectar Argentina
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'arg')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇧🇷 Recolectar Brasil
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'bra')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇲🇽 Recolectar México
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'mex')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇪🇸 Recolectar España
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'esp')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🏴󠁧󠁢󠁥󠁮󠁧󠁿 Recolectar Inglaterra (Premier League)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'eng')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇩🇪 Recolectar Alemania (Bundesliga)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'bund')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇮🇹 Recolectar Italia (Serie A)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'ita')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇫🇷 Recolectar Francia (Ligue 1)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'fra')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇳🇱 Recolectar Países Bajos (Eredivisie)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'ned')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇵🇹 Recolectar Portugal (Primeira Liga)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'por')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇧🇪 Recolectar Bélgica (Jupiler Pro League)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'bel')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇹🇷 Recolectar Turquía (Süper Lig)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'tur')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🏴󠁧󠁢󠁳󠁣󠁴󠁿 Recolectar Escocia (Scottish Premiership)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'sco')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇦🇹 Recolectar Austria (Austrian Bundesliga)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'aut')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇩🇰 Recolectar Dinamarca (Danish Superliga)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'den')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇬🇷 Recolectar Grecia (Super League)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'gre')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇳🇴 Recolectar Noruega (Eliteserien)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'nor')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇸🇪 Recolectar Suecia (Allsvenskan)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'swe')
          import recolectar as rec
          rec.recolectar()
          "

      - name: ⭐ Recolectar UEFA Champions League
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'ucl')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🇪🇺 Recolectar UEFA Nations League
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'unl')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 🏀 Recolectar NBA
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'nba')
          import recolectar as rec
          rec.recolectar()
          "

      - name: 💾 Commit updated CSVs (if any changes)
        if: ${{ !cancelled() }}  # una liga caída no debe impedir actualizar las demás
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only data CSVs (never model code or notebooks)
          git add chile/data/partidos.csv chile/data/fixture.csv \
                  arg/data/partidos.csv   arg/data/fixture.csv   \
                  bra/data/partidos.csv   bra/data/fixture.csv   \
                  mex/data/partidos.csv   mex/data/fixture.csv   \
                  esp/data/partidos.csv   esp/data/fixture.csv   \
                  eng/data/partidos.csv   eng/data/fixture.csv   \
                  bund/data/partidos.csv  bund/data/fixture.csv  \
                  ita/data/partidos.csv   ita/data/fixture.csv   \
                  fra/data/partidos.csv   fra/data/fixture.csv   \
                  ned/data/partidos.csv   ned/data/fixture.csv   \
                  por/data/partidos.csv   por/data/fixture.csv   \
                  bel/data/partidos.csv   bel/data/fixture.csv   \
                  tur/data/partidos.csv   tur/data/fixture.csv   \
                  sco/data/partidos.csv   sco/data/fixture.csv   \
                  aut/data/partidos.csv   aut/data/fixture.csv   \
                  den/data/partidos.csv   den/data/fixture.csv   \
                  gre/data/partidos.csv   gre/data/fixture.csv   \
                  nor/data/partidos.csv   nor/data/fixture.csv   \
                  swe/data/partidos.csv   swe/data/fixture.csv   \
                  ucl/data/partidos.csv   ucl/data/fixture.csv   \
                  unl/data/partidos.csv   unl/data/fixture.csv   \
                  nba/data/partidos.csv   nba/data/fixture.csv

          # Only commit if there are actual changes.
          # Si alguna liga falló, sus CSV no se tocaron: se commitean las demás y el job
          # termina en rojo igual (GitHub marca el run como fallido por ese paso).
          if git diff --cached --quiet; then
            echo "✅ No new match data — nothing to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "data(auto): refresh all leagues [${TIMESTAMP}]

          Automated daily refresh from ESPN API via GitHub Actions.
          CSVs updated: chile, arg, bra, mex, esp, eng, bund, ita, fra, ned, por, bel, tur, sco, aut, den, gre, nor, swe, ucl, unl, nba."
            git push origin main
            echo "✅ Pushed updated CSVs to main."
          fi


